name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: extendedjet
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Compile Python sources
        run: python -m py_compile fitting/*.py postprocessing/*.py tests/*.py validation/*.py

      - name: Check shell scripts
        run: |
          bash -n Code/SortNe.sh
          bash -n Code/SortNp.sh
          bash -n Code/SortSEDpsyn.sh
          bash -n Code/SortSEDesyn.sh

      - name: Build f2py module
        run: make -C Code f2py

      - name: Run test suite
        run: make -C Code test

      - name: Run physics validation
        env:
          OMP_NUM_THREADS: 1
        run: make -C Code validate-kernel
